name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to build and release (default: HEAD of selected branch)'
        required: false
        type: string
      config:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-manual
  cancel-in-progress: false

permissions:
  contents: write

env:
  FALCOR_DIR: Falcor

jobs:
  # ---------------------------------------------------------------------------
  # Resolve commit and generate version tag
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit and version
        id: resolve
        run: |
          SHA="${{ inputs.commit_sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse HEAD)"
          fi
          # Validate the SHA exists
          git cat-file -t "$SHA" >/dev/null 2>&1 || {
            echo "::error::Commit $SHA not found in repository"
            exit 1
          }
          SHA_FULL="$(git rev-parse "$SHA")"
          SHA_SHORT="$(git rev-parse --short=8 "$SHA")"
          TIMESTAMP="$(git show -s --format=%cd --date=format:%Y%m%d-%H%M%S "$SHA_FULL")"
          VERSION="${TIMESTAMP}-${SHA_SHORT}"
          TAG="dev-${VERSION}"

          echo "sha=${SHA_FULL}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "## Release Info" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${SHA_FULL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Config | ${{ inputs.config }} |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Windows VS2022 build at pinned commit
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (${{ inputs.config }})
    needs: [prepare]
    runs-on: windows-2022
    env:
      CMAKE_BUILD_PRESET: windows-vs2022-ci
      PM_PACKAGES_ROOT: C:\packman-cache
    steps:
      - name: Checkout at release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.19041.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache Falcor submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules/Falcor
            Falcor/external/pybind11
            Falcor/external/glfw
            Falcor/external/args
            Falcor/external/fmt
            Falcor/external/imgui
            Falcor/external/vulkan-headers
          key: falcor-submodules-${{ runner.os }}-v3
          restore-keys: falcor-submodules-

      - name: Init Falcor submodules
        shell: bash
        run: |
          for sub in Falcor/external/pybind11 Falcor/external/glfw Falcor/external/args Falcor/external/fmt Falcor/external/imgui Falcor/external/vulkan-headers; do
            if [ -d "$sub" ] && [ ! -f "$sub/.git" ]; then
              rm -rf "$sub"
            fi
          done
          git submodule update --init --depth 1

      - name: Cache packman packages
        uses: actions/cache@v4
        with:
          path: C:\packman-cache
          key: packman-${{ runner.os }}-${{ hashFiles('Falcor/dependencies.xml') }}
          restore-keys: packman-

      - name: Fetch Falcor packman dependencies
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          call tools\packman\packman.cmd pull --platform windows-x86_64 dependencies.xml

      - name: Integrate VisCache plugins into Falcor tree
        shell: pwsh
        run: |
          $Falcor = "${{ env.FALCOR_DIR }}"

          New-Item -ItemType Directory -Path "$Falcor/Source/RenderPasses/VisCache" -Force | Out-Null
          Copy-Item "Source/RenderPasses/VisCache/*" "$Falcor/Source/RenderPasses/VisCache/" -Recurse -Force

          New-Item -ItemType Directory -Path "$Falcor/Source/RenderPasses/ReSTIRGIPass" -Force | Out-Null
          Copy-Item "Source/RenderPasses/ReSTIRGIPass/*" "$Falcor/Source/RenderPasses/ReSTIRGIPass/" -Recurse -Force

          New-Item -ItemType Directory -Path "$Falcor/scripts/VisCache" -Force | Out-Null
          Copy-Item "scripts/*" "$Falcor/scripts/VisCache/" -Recurse -Force

          $rpCmake = "$Falcor/Source/RenderPasses/CMakeLists.txt"
          $content = Get-Content $rpCmake -Raw
          if ($content -notmatch "add_subdirectory\(VisCache\)") {
            Add-Content $rpCmake "`nadd_subdirectory(VisCache)"
          }
          if ($content -notmatch "add_subdirectory\(ReSTIRGIPass\)") {
            Add-Content $rpCmake "`nadd_subdirectory(ReSTIRGIPass)"
          }

          $extCmake = "$Falcor/external/CMakeLists.txt"
          $extContent = Get-Content $extCmake -Raw
          if ($extContent -notmatch "_SILENCE_STDEXT_ARR_ITERS_DEPRECATION_WARNING") {
            Add-Content $extCmake "`ntarget_compile_definitions(fmt PRIVATE _SILENCE_STDEXT_ARR_ITERS_DEPRECATION_WARNING)"
          }
          if ($extContent -notmatch "TBB_SUPPRESS_DEPRECATED_MESSAGES") {
            Add-Content $extCmake "`ntarget_compile_definitions(tbb INTERFACE TBB_SUPPRESS_DEPRECATED_MESSAGES=1)"
          }

          $falcorCmake = "$Falcor/Source/Falcor/CMakeLists.txt"
          $falcorContent = Get-Content $falcorCmake -Raw
          if ($falcorContent -notmatch "NODEFAULTLIB:MSVCRT") {
            $falcorContent = $falcorContent -replace `
              '(target_link_options\(Falcor\s+PUBLIC\s+# MSVC flags\.)', `
              "`$1`n        `$<`$<AND:`$<CXX_COMPILER_ID:MSVC>,`$<CONFIG:Debug>>:/NODEFAULTLIB:MSVCRT>"
            Set-Content $falcorCmake $falcorContent -NoNewline
          }

          $rootCmake = "$Falcor/CMakeLists.txt"
          $rootContent = Get-Content $rootCmake -Raw
          $trimPath = (Resolve-Path $Falcor).Path -replace '\\','/'
          if ($rootContent -notmatch "d1trimfile") {
            $rootContent = $rootContent -replace `
              '(project\(Falcor[^)]*\))', `
              "`$1`nadd_compile_options(/d1trimfile:$trimPath/)"
            Set-Content $rootCmake $rootContent -NoNewline
          }

      - name: CMake Configure
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          tools\.packman\cmake\bin\cmake.exe --preset %CMAKE_BUILD_PRESET% -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          tools\.packman\cmake\bin\cmake.exe --build build\%CMAKE_BUILD_PRESET% --config ${{ inputs.config }} -- /m

      - name: Print sccache stats
        if: always()
        shell: cmd
        run: sccache --show-stats

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: viscache-windows-${{ inputs.config }}-${{ needs.prepare.outputs.sha_short }}
          path: |
            ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/bin/${{ inputs.config }}/
            scripts/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Package release archives
        run: |
          cd release-artifacts
          for dir in */; do
            name="${dir%/}"
            echo "Packaging ${name}..."
            tar -czf "../${name}.tar.gz" -C "$dir" .
          done
          ls -lh ../*.tar.gz

      - name: Create git tag
        run: |
          git tag "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.sha }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "VisCache ${{ needs.prepare.outputs.version }} (${{ inputs.config }})"
          generate_release_notes: true
          files: "*.tar.gz"
          draft: false
          prerelease: ${{ inputs.prerelease }}
          body: |
            ## VisCache dev release

            | Field | Value |
            |-------|-------|
            | Commit | `${{ needs.prepare.outputs.sha }}` |
            | Config | ${{ inputs.config }} |
            | Version | `${{ needs.prepare.outputs.version }}` |

            ### Contents

            - `Mogwai.exe` — Falcor viewer with VisCache + ReSTIR GI plugins
            - `scripts/` — Render graphs, ablation capture, baseline capture

            See [Using a release](#using-a-release) in the README for setup instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

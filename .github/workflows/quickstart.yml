name: Quickstart Smoke Test

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'scripts/install.*'
      - 'scripts/quickstart.*'
      - 'scripts/download_release.*'
      - 'scripts/download_scenes.*'
      - 'scripts/run_release.*'
      - 'scripts/run-tests.*'
      - '.github/workflows/quickstart.yml'
  pull_request:
    branches: ["main", "master"]
    paths:
      - 'scripts/install.*'
      - 'scripts/quickstart.*'
      - 'scripts/download_release.*'
      - 'scripts/download_scenes.*'
      - 'scripts/run_release.*'
      - 'scripts/run-tests.*'
      - '.github/workflows/quickstart.yml'
  workflow_dispatch:

concurrency:
  group: quickstart-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # install.bat (Windows) — tests the curl one-liner flow
  # ---------------------------------------------------------------------------
  install-windows:
    name: Install (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout (for local install script)
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show git version
        run: git --version

      # Use the branch name for clone (--branch requires a ref, not a SHA).
      # For PRs use head_ref (source branch), for pushes use ref_name (e.g. "main").
      - name: Test install.bat (first run — clone)
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          call "${{ github.workspace }}\scripts\install.bat" --dir VCS-test --branch ${{ github.head_ref || github.ref_name }} --skip-scenes --skip-launch

      - name: Verify clone succeeded
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          if not exist "VCS-test\.git" (echo Clone did not create .git & exit /b 1)
          echo Clone OK

      - name: Test install.bat (re-run — idempotent pull)
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          call "${{ github.workspace }}\scripts\install.bat" --dir VCS-test --branch ${{ github.head_ref || github.ref_name }} --skip-scenes --skip-launch

      - name: Verify repo still valid after re-run
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          if not exist "VCS-test\.git" (echo .git missing after re-run & exit /b 1)
          echo Idempotent re-run OK

  # ---------------------------------------------------------------------------
  # CPU tests via run-tests scripts (Linux + Windows)
  # ---------------------------------------------------------------------------
  cpu-tests-linux:
    name: CPU Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: run-tests.sh (all)
        run: bash scripts/run-tests.sh
      - name: run-tests.sh (quick) — idempotent re-run
        run: bash scripts/run-tests.sh quick

  cpu-tests-windows:
    name: CPU Tests (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: run-tests.bat (all)
        run: scripts\run-tests.bat
      - name: run-tests.bat (quick) — idempotent re-run
        run: scripts\run-tests.bat quick

  # ---------------------------------------------------------------------------
  # Validate scene download URLs are reachable (HEAD request, no full download)
  # ---------------------------------------------------------------------------
  check-scene-urls:
    name: Scene URL Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract and validate scene URLs
        run: |
          set -euo pipefail
          FAIL=0

          # URLs from download_scenes.sh (grep the actual variable assignments)
          BISTRO_URL=$(grep '^BISTRO_URL=' scripts/download_scenes.sh | cut -d'"' -f2)
          SPONZA_URL=$(grep '^SPONZA_URL=' scripts/download_scenes.sh | cut -d'"' -f2)
          VEACH_URL=$(grep '^VEACHAJAR_REPO=' scripts/download_scenes.sh | cut -d'"' -f2)

          for NAME_URL in "Bistro|$BISTRO_URL" "Sponza|$SPONZA_URL" "VeachAjar|$VEACH_URL"; do
            NAME="${NAME_URL%%|*}"
            URL="${NAME_URL#*|}"
            echo "--- $NAME: $URL"
            # Use -I (HEAD) without -L so redirects (302) count as reachable
            # and we never download a multi-GB file body.
            HTTP_CODE=$(curl -sI -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 30 "$URL")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "  OK (HTTP $HTTP_CODE)"
            else
              echo "  FAIL (HTTP $HTTP_CODE)"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "::error::One or more scene download URLs are broken. Update scripts/download_scenes.sh"
            exit 1
          fi

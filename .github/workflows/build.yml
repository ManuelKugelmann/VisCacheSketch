name: Build

on:
  # Pre-flight jobs run on push/PR; full builds only on workflow_dispatch
  push:
    branches: ["main", "master"]
    paths:
      - 'scripts/**'
      - 'Source/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: ["main", "master"]
    paths:
      - 'scripts/**'
      - 'Source/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'Windows Ninja'
        type: choice
        options:
          - Windows Ninja
          - All
          - Windows VS2022
          - Linux GCC
      config:
        description: 'Build configuration'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
          - Both
      create_prerelease:
        description: 'Create a dev prerelease after build (stable releases use v* tags instead)'
        required: false
        default: true
        type: boolean
      commit_sha:
        description: 'Commit SHA to build and release (default: HEAD of selected branch)'
        required: false
        type: string

# Queue new runs behind in-progress ones (won't cancel running builds)
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FALCOR_DIR: Falcor

jobs:
  # ---------------------------------------------------------------------------
  # Resolve commit and generate version tag (used by all build + release jobs)
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve commit and version
        id: resolve
        run: |
          SHA="${{ inputs.commit_sha }}"
          if [ -z "$SHA" ]; then
            SHA="${GITHUB_SHA}"
          fi
          git cat-file -t "$SHA" >/dev/null 2>&1 || {
            echo "::error::Commit $SHA not found in repository"
            exit 1
          }
          SHA_FULL="$(git rev-parse "$SHA")"
          SHA_SHORT="$(git rev-parse --short=8 "$SHA")"
          TIMESTAMP="$(git show -s --format=%cd --date=format:%Y%m%d-%H%M%S "$SHA_FULL")"
          VERSION="${TIMESTAMP}-${SHA_SHORT}"
          TAG="dev-${VERSION}"

          echo "sha=${SHA_FULL}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "## Build Info" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${SHA_FULL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

  # Fast check — always visible in PR, skips builds if no source changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'Source/**'
              - 'Falcor/**'
              - 'scripts/**'
              - 'CMakeLists.txt'
              - 'setup.*'
              - '.github/workflows/build.yml'

  # ---------------------------------------------------------------------------
  # Pre-flight: validate scripts, CMake injection, CMD syntax (fast, before builds)
  # ---------------------------------------------------------------------------
  pre-flight-linux:
    name: Pre-flight (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: shellcheck
        run: |
          sudo apt-get -qq install -y shellcheck
          shellcheck scripts/integrate-plugins.sh scripts/verify-build-output.sh

      - name: Test integrate-plugins.sh
        run: |
          bash scripts/integrate-plugins.sh Falcor
          # Verify CMake injection
          grep -q 'add_subdirectory(VisCache)' Falcor/Source/RenderPasses/CMakeLists.txt
          grep -q 'add_subdirectory(ReSTIRPTPass)' Falcor/Source/RenderPasses/CMakeLists.txt
          test -d Falcor/Source/RenderPasses/VisCache
          test -d Falcor/Source/RenderPasses/ReSTIRPTPass
          echo "[pre-flight] integrate-plugins.sh OK"

      - name: Test idempotent re-run
        run: |
          bash scripts/integrate-plugins.sh Falcor
          echo "[pre-flight] Idempotent re-run OK"

  pre-flight-windows:
    name: Pre-flight (Windows)
    runs-on: windows-2022
    env:
      CMAKE_BUILD_PRESET: windows-ninja-msvc-ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Test integrate-plugins.bat
        shell: cmd
        run: |
          call scripts\integrate-plugins.bat Falcor
          findstr /C:"add_subdirectory(VisCache)" "Falcor\Source\RenderPasses\CMakeLists.txt" >nul || (echo VisCache subdirectory missing & exit /b 1)
          findstr /C:"add_subdirectory(ReSTIRPTPass)" "Falcor\Source\RenderPasses\CMakeLists.txt" >nul || (echo ReSTIRPTPass subdirectory missing & exit /b 1)
          echo [pre-flight] integrate-plugins.bat OK

      - name: Test idempotent re-run
        shell: cmd
        run: |
          call scripts\integrate-plugins.bat Falcor
          echo [pre-flight] Idempotent re-run OK

      - name: Dry-run build CMD blocks
        shell: cmd
        run: |
          REM Create mock build directory to exercise CMD patterns from build.yml
          set "BUILD_DIR=Falcor\build\%CMAKE_BUILD_PRESET%"
          mkdir "%BUILD_DIR%" 2>nul

          REM --- Test: Clean stale CMake cache (no CMakeCache.txt) ---
          if not exist "%BUILD_DIR%\CMakeCache.txt" goto :skip_clean
          findstr /C:"host=x64" "%BUILD_DIR%\CMakeCache.txt" >nul 2>&1
          if not errorlevel 1 goto :skip_clean
          echo [dry-run] Stale CMakeCache.txt detected, removing...
          del /q "%BUILD_DIR%\CMakeCache.txt"
          if exist "%BUILD_DIR%\CMakeFiles" rmdir /s /q "%BUILD_DIR%\CMakeFiles"
          :skip_clean
          echo [dry-run] Clean stale CMake: OK

          REM --- Test: Clean stale (with a mock stale cache) ---
          echo wrong_toolset > "%BUILD_DIR%\CMakeCache.txt"
          if not exist "%BUILD_DIR%\CMakeCache.txt" goto :skip_stale
          findstr /C:"host=x64" "%BUILD_DIR%\CMakeCache.txt" >nul 2>&1
          if not errorlevel 1 goto :skip_stale
          echo [dry-run] Stale CMakeCache.txt detected, removing...
          del /q "%BUILD_DIR%\CMakeCache.txt"
          if exist "%BUILD_DIR%\CMakeFiles" rmdir /s /q "%BUILD_DIR%\CMakeFiles"
          :skip_stale
          if exist "%BUILD_DIR%\CMakeCache.txt" (echo FAIL: stale cache not removed & exit /b 1)
          echo [dry-run] Stale cache removal: OK

          REM --- Test: Check NRD availability ---
          if exist "%BUILD_DIR%\Source\RenderPasses\NRDPass" (
            echo [dry-run] NRDPass: ENABLED
          ) else (
            echo.
            echo ========================================================
            echo  WARNING: NRDPass DISABLED - missing NRD package or D3D12
            echo  The release will NOT include NRD denoiser support.
            echo ========================================================
            echo.
            echo [dry-run] NRDPass check: OK
          )

          REM --- Test: Cache cleanup patterns ---
          mkdir "%BUILD_DIR%\obj" 2>nul
          echo mock > "%BUILD_DIR%\obj\test.pdb"
          echo mock > "%BUILD_DIR%\obj\test.ilk"
          echo mock > "%BUILD_DIR%\obj\test.exp"
          echo mock > "%BUILD_DIR%\obj\test.ipdb"
          echo mock > "%BUILD_DIR%\obj\test.iobj"
          mkdir "%BUILD_DIR%\bin" 2>nul
          echo mock > "%BUILD_DIR%\bin\Mogwai.exe"
          del /s /q "%BUILD_DIR%\*.pdb" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.ilk" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.exp" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.ipdb" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.iobj" >nul 2>&1
          if exist "%BUILD_DIR%\bin" rmdir /s /q "%BUILD_DIR%\bin"
          if exist "%BUILD_DIR%\obj\test.pdb" (echo FAIL: PDB not cleaned & exit /b 1)
          if exist "%BUILD_DIR%\bin" (echo FAIL: bin not cleaned & exit /b 1)
          echo [dry-run] Cache cleanup: OK

          echo.
          echo [dry-run] All CMD blocks validated successfully.

  # ---------------------------------------------------------------------------
  # Windows/VS2022 — secondary build, validates VS solution generation
  # ---------------------------------------------------------------------------
  windows-vs2022:
    name: Windows VS2022
    needs: [prepare, pre-flight-windows]
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.platform == 'All' || inputs.platform == 'Windows VS2022' || inputs.platform == '')
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config: ${{ inputs.config == 'Release' && fromJSON('["Release"]') || inputs.config == 'Debug' && fromJSON('["Debug"]') || fromJSON('["Release", "Debug"]') }}
    env:
      CMAKE_BUILD_PRESET: windows-vs2022-ci
      # Pin packman cache location for reproducible caching on Windows
      PM_PACKAGES_ROOT: C:\packman-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.19041.0

      # -- Caching: sccache for compiled objects --------------------------------
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        env:
          SCCACHE_CACHE_SIZE: 2G

      # -- Caching: CMake build directory (incremental builds) -----------------
      # Split into restore/save so we can strip large link artifacts before saving
      - name: Restore CMake build cache
        id: cmake-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-vs2022-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-vs2022-${{ matrix.config }}-

      # -- Caching: Falcor internal submodules --------------------------------
      - name: Cache Falcor submodules
        uses: actions/cache@v5
        with:
          path: |
            .git/modules/Falcor
            Falcor/external/pybind11
            Falcor/external/glfw
            Falcor/external/args
            Falcor/external/fmt
            Falcor/external/imgui
            Falcor/external/vulkan-headers
          key: falcor-submodules-${{ runner.os }}-v3
          restore-keys: falcor-submodules-

      - name: Init Falcor submodules
        shell: bash
        run: |
          # Remove cached working trees that lack .git metadata (stale v2 cache)
          for sub in Falcor/external/pybind11 Falcor/external/glfw Falcor/external/args Falcor/external/fmt Falcor/external/imgui Falcor/external/vulkan-headers; do
            if [ -d "$sub" ] && [ ! -f "$sub/.git" ]; then
              rm -rf "$sub"
            fi
          done
          git submodule update --init --depth 1

      # -- Caching: NVIDIA packman packages -----------------------------------
      - name: Cache packman packages
        uses: actions/cache@v5
        with:
          path: C:\packman-cache
          key: packman-${{ runner.os }}-${{ hashFiles('Falcor/dependencies.xml') }}
          restore-keys: packman-

      - name: Fetch Falcor packman dependencies
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          call tools\packman\packman.cmd pull --platform windows-x86_64 dependencies.xml

      - name: Integrate VisCache plugins into Falcor tree
        shell: cmd
        run: call scripts\integrate-plugins.bat ${{ env.FALCOR_DIR }}

      - name: Clean stale CMake cache
        shell: cmd
        run: |
          set "BUILD_DIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%"
          if not exist "%BUILD_DIR%\CMakeCache.txt" goto :eof
          findstr /C:"host=x64" "%BUILD_DIR%\CMakeCache.txt" >nul 2>&1
          if not errorlevel 1 goto :eof
          echo [build] Stale CMakeCache.txt detected, removing...
          del /q "%BUILD_DIR%\CMakeCache.txt"
          if exist "%BUILD_DIR%\CMakeFiles" rmdir /s /q "%BUILD_DIR%\CMakeFiles"

      - name: CMake Configure
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          tools\.packman\cmake\bin\cmake.exe --preset %CMAKE_BUILD_PRESET% -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Check NRD availability
        shell: cmd
        run: |
          set "BUILD_DIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%"
          if exist "%BUILD_DIR%\Source\RenderPasses\NRDPass" (
            echo [build] NRDPass: ENABLED
          ) else (
            echo.
            echo ========================================================
            echo  WARNING: NRDPass DISABLED - missing NRD package or D3D12
            echo  The release will NOT include NRD denoiser support.
            echo  Output will be raw noisy radiance.
            echo ========================================================
            echo.
            echo ::warning::NRDPass DISABLED - release will not include NRD denoiser
          )

      - name: Build
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          tools\.packman\cmake\bin\cmake.exe --build build\%CMAKE_BUILD_PRESET% --config ${{ matrix.config }} -- /m

      - name: Print sccache stats
        if: always()
        shell: cmd
        run: sccache --show-stats

      - name: Verify build output
        shell: cmd
        run: |
          set "OUTDIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%\bin\${{ matrix.config }}"
          call scripts\verify-build-output.bat "%OUTDIR%"

      - name: Deploy scripts to build output
        if: matrix.config == 'Release'
        shell: cmd
        run: |
          set OUTDIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%\bin\${{ matrix.config }}
          if not exist "%OUTDIR%\scripts\VisCache" mkdir "%OUTDIR%\scripts\VisCache"
          xcopy "scripts\*" "%OUTDIR%\scripts\VisCache\" /s /y /q >nul
          echo [CI] Deployed scripts to build output

      - name: Headless smoke test
        if: matrix.config == 'Release'
        shell: cmd
        continue-on-error: true   # no GPU on CI — device creation will fail
        run: |
          cd ${{ env.FALCOR_DIR }}
          set BINDIR=build\%CMAKE_BUILD_PRESET%\bin\${{ matrix.config }}
          echo [CI] Attempting headless smoke test (no GPU expected)...
          %BINDIR%\Mogwai.exe --headless --script %BINDIR%\scripts\VisCache\smoke_test.py 2>&1 || (
            echo [CI] Mogwai exited with code %ERRORLEVEL% — expected without GPU
          )
          exit /b 0

      # -- Save slimmed CMake build cache (strip PDB/ILK to cut ~60-80% size) --
      - name: Slim and save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          set "BUILD_DIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%"
          echo [cache] Before cleanup:
          powershell -NoProfile -Command "$s=(Get-ChildItem '%BUILD_DIR%' -Recurse -File -ErrorAction SilentlyContinue|Measure-Object -Property Length -Sum).Sum; '{0:N0} MB' -f ($s/1MB)"
          del /s /q "%BUILD_DIR%\*.pdb" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.ilk" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.exp" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.ipdb" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.iobj" >nul 2>&1
          if exist "%BUILD_DIR%\bin" rmdir /s /q "%BUILD_DIR%\bin"
          echo [cache] After cleanup:
          powershell -NoProfile -Command "$s=(Get-ChildItem '%BUILD_DIR%' -Recurse -File -ErrorAction SilentlyContinue|Measure-Object -Property Length -Sum).Sum; '{0:N0} MB' -f ($s/1MB)"

      - name: Save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-vs2022-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}

      - name: Upload build artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: falcor-windows-vs2022-${{ matrix.config }}
          path: |
            ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/bin/${{ matrix.config }}/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows Ninja/MSVC — primary build (fastest), gates PRs + feeds releases
  # ---------------------------------------------------------------------------
  windows-ninja:
    name: Windows Ninja/MSVC
    needs: [prepare, changes, pre-flight-windows]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.pre-flight-windows.result != 'failure'
      && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
      && (needs.changes.outputs.source == 'true' || github.event_name != 'pull_request')
      && (inputs.platform == 'All' || inputs.platform == 'Windows Ninja' || inputs.platform == '' || github.event_name != 'workflow_dispatch')
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # PRs: Debug only; manual dispatch: respect input; pushes: both
        config: ${{ github.event_name == 'pull_request' && fromJSON('["Debug"]') || inputs.config == 'Release' && fromJSON('["Release"]') || inputs.config == 'Debug' && fromJSON('["Debug"]') || fromJSON('["Release", "Debug"]') }}
    env:
      CMAKE_BUILD_PRESET: windows-ninja-msvc-ci
      PM_PACKAGES_ROOT: C:\packman-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.19041.0

      # -- Caching: sccache for compiled objects --------------------------------
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        env:
          SCCACHE_CACHE_SIZE: 2G

      # -- Caching: CMake build directory (incremental builds) -----------------
      # Split into restore/save so we can strip large link artifacts before saving
      - name: Restore CMake build cache
        id: cmake-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-ninja-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-ninja-${{ matrix.config }}-

      # -- Caching: Falcor internal submodules --------------------------------
      - name: Cache Falcor submodules
        uses: actions/cache@v5
        with:
          path: |
            .git/modules/Falcor
            Falcor/external/pybind11
            Falcor/external/glfw
            Falcor/external/args
            Falcor/external/fmt
            Falcor/external/imgui
            Falcor/external/vulkan-headers
          key: falcor-submodules-${{ runner.os }}-v3
          restore-keys: falcor-submodules-

      - name: Init Falcor submodules
        shell: bash
        run: |
          for sub in Falcor/external/pybind11 Falcor/external/glfw Falcor/external/args Falcor/external/fmt Falcor/external/imgui Falcor/external/vulkan-headers; do
            if [ -d "$sub" ] && [ ! -f "$sub/.git" ]; then
              rm -rf "$sub"
            fi
          done
          git submodule update --init --depth 1

      # -- Caching: NVIDIA packman packages -----------------------------------
      - name: Cache packman packages
        uses: actions/cache@v5
        with:
          path: C:\packman-cache
          key: packman-${{ runner.os }}-${{ hashFiles('Falcor/dependencies.xml') }}
          restore-keys: packman-

      - name: Fetch Falcor packman dependencies
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          call tools\packman\packman.cmd pull --platform windows-x86_64 dependencies.xml

      - name: Integrate VisCache plugins into Falcor tree
        shell: cmd
        run: call scripts\integrate-plugins.bat ${{ env.FALCOR_DIR }}

      - name: Clean stale CMake cache
        shell: cmd
        run: |
          set "BUILD_DIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%"
          if not exist "%BUILD_DIR%\CMakeCache.txt" goto :eof
          findstr /C:"host=x64" "%BUILD_DIR%\CMakeCache.txt" >nul 2>&1
          if not errorlevel 1 goto :eof
          echo [build] Stale CMakeCache.txt detected, removing...
          del /q "%BUILD_DIR%\CMakeCache.txt"
          if exist "%BUILD_DIR%\CMakeFiles" rmdir /s /q "%BUILD_DIR%\CMakeFiles"

      - name: CMake Configure
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          tools\.packman\cmake\bin\cmake.exe --preset %CMAKE_BUILD_PRESET% -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Check NRD availability
        shell: cmd
        run: |
          set "BUILD_DIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%"
          if exist "%BUILD_DIR%\Source\RenderPasses\NRDPass" (
            echo [build] NRDPass: ENABLED
          ) else (
            echo.
            echo ========================================================
            echo  WARNING: NRDPass DISABLED - missing NRD package or D3D12
            echo  The release will NOT include NRD denoiser support.
            echo  Output will be raw noisy radiance.
            echo ========================================================
            echo.
            echo ::warning::NRDPass DISABLED - release will not include NRD denoiser
          )

      - name: Build
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          tools\.packman\cmake\bin\cmake.exe --build build\%CMAKE_BUILD_PRESET% --config ${{ matrix.config }}

      - name: Print sccache stats
        if: always()
        shell: cmd
        run: sccache --show-stats

      - name: Verify build output
        shell: cmd
        run: |
          set "OUTDIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%\bin\${{ matrix.config }}"
          call scripts\verify-build-output.bat "%OUTDIR%"

      - name: Deploy scripts to build output
        if: matrix.config == 'Release'
        shell: cmd
        run: |
          set "OUTDIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%\bin\${{ matrix.config }}"
          if not exist "%OUTDIR%\scripts\VisCache" mkdir "%OUTDIR%\scripts\VisCache"
          xcopy "scripts\*" "%OUTDIR%\scripts\VisCache\" /s /y /q >nul
          echo [CI] Deployed scripts to build output

      - name: Headless smoke test
        if: matrix.config == 'Release'
        shell: cmd
        continue-on-error: true   # no GPU on CI — device creation will fail
        run: |
          set "BINDIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%\bin\${{ matrix.config }}"
          echo [CI] Attempting headless smoke test...
          "%BINDIR%\Mogwai.exe" --headless --script "%BINDIR%\scripts\VisCache\smoke_test.py" 2>&1 || (
            echo [CI] Mogwai exited — expected without GPU
          )
          exit /b 0

      # -- Save slimmed CMake build cache (strip PDB/ILK to cut ~60-80% size) --
      - name: Slim and save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          set "BUILD_DIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%"
          echo [cache] Before cleanup:
          powershell -NoProfile -Command "$s=(Get-ChildItem '%BUILD_DIR%' -Recurse -File -ErrorAction SilentlyContinue|Measure-Object -Property Length -Sum).Sum; '{0:N0} MB' -f ($s/1MB)"
          del /s /q "%BUILD_DIR%\*.pdb" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.ilk" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.exp" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.ipdb" >nul 2>&1
          del /s /q "%BUILD_DIR%\*.iobj" >nul 2>&1
          if exist "%BUILD_DIR%\bin" rmdir /s /q "%BUILD_DIR%\bin"
          echo [cache] After cleanup:
          powershell -NoProfile -Command "$s=(Get-ChildItem '%BUILD_DIR%' -Recurse -File -ErrorAction SilentlyContinue|Measure-Object -Property Length -Sum).Sum; '{0:N0} MB' -f ($s/1MB)"

      - name: Save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-ninja-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}

      - name: Bundle Falcor media scenes
        if: matrix.config == 'Release'
        shell: cmd
        run: |
          set OUTDIR=${{ env.FALCOR_DIR }}\build\%CMAKE_BUILD_PRESET%\bin\${{ matrix.config }}
          if exist "${{ env.FALCOR_DIR }}\media\Arcade" (
            xcopy "${{ env.FALCOR_DIR }}\media\Arcade" "%OUTDIR%\media\Arcade\" /s /y /q >nul
            echo [CI] Bundled Arcade scene
          )
          if exist "${{ env.FALCOR_DIR }}\media\TestScenes" (
            xcopy "${{ env.FALCOR_DIR }}\media\TestScenes" "%OUTDIR%\media\TestScenes\" /s /y /q >nul
            echo [CI] Bundled TestScenes
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: falcor-windows-ninja-${{ matrix.config }}
          path: |
            ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/bin/${{ matrix.config }}/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux/GCC — optional, does not block PRs or releases (non-PR only)
  # ---------------------------------------------------------------------------
  linux-gcc:
    name: Linux/GCC
    needs: [prepare, pre-flight-linux]
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.platform == 'All' || inputs.platform == 'Linux GCC' || inputs.platform == '')
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config: ${{ inputs.config == 'Release' && fromJSON('["Release"]') || inputs.config == 'Debug' && fromJSON('["Debug"]') || fromJSON('["Release", "Debug"]') }}
    env:
      CMAKE_BUILD_PRESET: linux-gcc-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Cache Falcor submodules
        uses: actions/cache@v5
        with:
          path: |
            .git/modules/Falcor
            Falcor/external/pybind11
            Falcor/external/glfw
            Falcor/external/args
            Falcor/external/fmt
            Falcor/external/imgui
            Falcor/external/vulkan-headers
          key: falcor-submodules-${{ runner.os }}-v3
          restore-keys: falcor-submodules-

      - name: Init Falcor submodules
        run: |
          for sub in Falcor/external/pybind11 Falcor/external/glfw Falcor/external/args Falcor/external/fmt Falcor/external/imgui Falcor/external/vulkan-headers; do
            if [ -d "$sub" ] && [ ! -f "$sub/.git" ]; then
              rm -rf "$sub"
            fi
          done
          git submodule update --init --depth 1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libgtk-3-dev ccache

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-gcc-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc-${{ matrix.config }}-
            ccache-${{ runner.os }}-gcc-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime
          ccache -z

      # -- Caching: CMake build directory (incremental builds) -----------------
      # Split into restore/save so we can strip large debug/link artifacts before saving
      - name: Restore CMake build cache
        id: cmake-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-gcc-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-gcc-${{ matrix.config }}-

      - name: Cache packman packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/packman
          key: packman-${{ runner.os }}-${{ hashFiles('Falcor/dependencies.xml') }}
          restore-keys: packman-

      - name: Fetch Falcor packman dependencies
        run: |
          cd ${{ env.FALCOR_DIR }}
          chmod +x tools/packman/packman
          ./tools/packman/packman pull --platform linux-x86_64 dependencies.xml

      - name: Patch NVTT package
        run: |
          cd ${{ env.FALCOR_DIR }}
          cp -fp external/packman/nvtt/libnvtt.so.30106 external/packman/nvtt/libnvtt.so

      - name: Integrate VisCache plugins into Falcor tree
        run: bash scripts/integrate-plugins.sh ${{ env.FALCOR_DIR }}

      - name: CMake Configure
        run: |
          cd ${{ env.FALCOR_DIR }}
          SRCDIR="$(pwd)"
          ./tools/.packman/cmake/bin/cmake --preset ${{ env.CMAKE_BUILD_PRESET }} \
            -DFALCOR_VALIDATE_HEADERS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DCMAKE_C_FLAGS=-ffile-prefix-map=${SRCDIR}/=" \
            "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=${SRCDIR}/="

      - name: Check NRD availability
        run: |
          if [ -d "${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/Source/RenderPasses/NRDPass" ]; then
            echo "[build] NRDPass: ENABLED (FALCOR_HAS_NRD + D3D12)"
          else
            echo ""
            echo "========================================================"
            echo " WARNING: NRDPass DISABLED - missing NRD package or D3D12"
            echo " (Expected on Linux — NRD requires D3D12)"
            echo "========================================================"
            echo ""
            echo "::warning::NRDPass DISABLED on Linux (expected — NRD requires D3D12)"
          fi

      - name: Build
        run: |
          cd ${{ env.FALCOR_DIR }}
          ./tools/.packman/cmake/bin/cmake --build build/${{ env.CMAKE_BUILD_PRESET }} --config ${{ matrix.config }} -j $(nproc)

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Verify data file deployment
        run: bash scripts/verify-build-output.sh "${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/bin"

      # -- Save slimmed CMake build cache (strip debug symbols to cut size) ----
      - name: Slim and save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        run: |
          BUILD_DIR="${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}"
          echo "[cache] Before cleanup:"
          du -sh "$BUILD_DIR" 2>/dev/null || true
          find "$BUILD_DIR" -name '*.dwp' -delete 2>/dev/null || true
          find "$BUILD_DIR" -name '*.dwo' -delete 2>/dev/null || true
          rm -rf "$BUILD_DIR/bin" 2>/dev/null || true
          echo "[cache] After cleanup:"
          du -sh "$BUILD_DIR" 2>/dev/null || true

      - name: Save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-gcc-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}

  # ---------------------------------------------------------------------------
  # Dev prerelease — rolling "latest build" on every push to main/master
  # ---------------------------------------------------------------------------
  dev-release:
    name: Dev Prerelease
    runs-on: ubuntu-latest
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.windows-ninja.result == 'success'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_prerelease))
      && !startsWith(github.ref, 'refs/tags/')
    needs: [prepare, windows-ninja]
    env:
      # Release if available, otherwise Debug
      RELEASE_CONFIG: ${{ inputs.config == 'Debug' && 'Debug' || 'Release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download Ninja build artifact
        uses: actions/download-artifact@v7
        with:
          name: falcor-windows-ninja-${{ env.RELEASE_CONFIG }}
          path: release-bin/

      - name: Package release archive
        run: |
          ARCHIVE="viscache-windows-${{ env.RELEASE_CONFIG }}.tar.gz"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          tar -czf "${ARCHIVE}" -C release-bin .
          ls -lh "${ARCHIVE}"

      - name: Create versioned prerelease
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          SHA="${{ needs.prepare.outputs.sha }}"
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          gh release create "${TAG}" "${{ env.ARCHIVE }}" \
            --title "Dev Build ${VERSION}" \
            --notes "Automated prerelease from \`${SHA_SHORT}\` on \`${GITHUB_REF_NAME}\`.

          | Field | Value |
          |-------|-------|
          | Commit | \`${SHA}\` |
          | Version | \`${VERSION}\` |
          | Config | ${{ env.RELEASE_CONFIG }} |

          **Not a stable release.** Use tagged \`v*\` releases for production." \
            --prerelease \
            --target "${SHA}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old dev prereleases (keep latest 3)
        run: |
          gh release list --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("dev-2")))] | sort_by(.tagName) | reverse | .[3:][] | .tagName' \
          | while read -r tag; do
              echo "Deleting old prerelease: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Tagged release — triggered on v* tags after successful builds
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, windows-ninja]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts/

      - name: Package release archives
        run: |
          cd release-artifacts
          for dir in */; do
            name="${dir%/}"
            echo "Packaging ${name}..."
            tar -czf "../${name}.tar.gz" -C "$dir" .
          done
          ls -lh ../*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

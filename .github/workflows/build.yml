name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'Windows VS2022'
        type: choice
        options:
          - Windows VS2022
          - All
          - Windows Ninja
          - Linux GCC
      config:
        description: 'Build configuration'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
          - Both
      commit_sha:
        description: 'Commit SHA to build and release (default: HEAD of selected branch)'
        required: false
        type: string

# Queue new runs behind in-progress ones (won't cancel running builds)
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FALCOR_DIR: Falcor

jobs:
  # ---------------------------------------------------------------------------
  # Resolve commit and generate version tag (used by all build + release jobs)
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve commit and version
        id: resolve
        run: |
          SHA="${{ inputs.commit_sha }}"
          if [ -z "$SHA" ]; then
            SHA="${GITHUB_SHA}"
          fi
          git cat-file -t "$SHA" >/dev/null 2>&1 || {
            echo "::error::Commit $SHA not found in repository"
            exit 1
          }
          SHA_FULL="$(git rev-parse "$SHA")"
          SHA_SHORT="$(git rev-parse --short=8 "$SHA")"
          TIMESTAMP="$(git show -s --format=%cd --date=format:%Y%m%d-%H%M%S "$SHA_FULL")"
          VERSION="${TIMESTAMP}-${SHA_SHORT}"
          TAG="dev-${VERSION}"

          echo "sha=${SHA_FULL}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "## Build Info" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${SHA_FULL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Windows/VS2022 — primary build, feeds releases
  # ---------------------------------------------------------------------------
  windows-vs2022:
    name: Windows VS2022
    needs: [prepare]
    if: >-
      needs.prepare.result == 'success'
      && (inputs.platform == 'All' || inputs.platform == 'Windows VS2022' || inputs.platform == '')
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: ${{ inputs.config == 'Release' && fromJSON('["Release"]') || inputs.config == 'Debug' && fromJSON('["Debug"]') || fromJSON('["Release", "Debug"]') }}
    env:
      CMAKE_BUILD_PRESET: windows-vs2022-ci
      # Pin packman cache location for reproducible caching on Windows
      PM_PACKAGES_ROOT: C:\packman-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.19041.0

      # -- Caching: sccache for compiled objects --------------------------------
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        env:
          SCCACHE_CACHE_SIZE: 2G

      # -- Caching: CMake build directory (incremental builds) -----------------
      # Split into restore/save so we can strip large link artifacts before saving
      - name: Restore CMake build cache
        id: cmake-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-vs2022-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-vs2022-${{ matrix.config }}-

      # -- Caching: Falcor internal submodules --------------------------------
      - name: Cache Falcor submodules
        uses: actions/cache@v5
        with:
          path: |
            .git/modules/Falcor
            Falcor/external/pybind11
            Falcor/external/glfw
            Falcor/external/args
            Falcor/external/fmt
            Falcor/external/imgui
            Falcor/external/vulkan-headers
          key: falcor-submodules-${{ runner.os }}-v3
          restore-keys: falcor-submodules-

      - name: Init Falcor submodules
        shell: bash
        run: |
          # Remove cached working trees that lack .git metadata (stale v2 cache)
          for sub in Falcor/external/pybind11 Falcor/external/glfw Falcor/external/args Falcor/external/fmt Falcor/external/imgui Falcor/external/vulkan-headers; do
            if [ -d "$sub" ] && [ ! -f "$sub/.git" ]; then
              rm -rf "$sub"
            fi
          done
          git submodule update --init --depth 1

      # -- Caching: NVIDIA packman packages -----------------------------------
      - name: Cache packman packages
        uses: actions/cache@v5
        with:
          path: C:\packman-cache
          key: packman-${{ runner.os }}-${{ hashFiles('Falcor/dependencies.xml') }}
          restore-keys: packman-

      - name: Fetch Falcor packman dependencies
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          call tools\packman\packman.cmd pull --platform windows-x86_64 dependencies.xml

      - name: Integrate VisCache plugins into Falcor tree
        shell: cmd
        run: call scripts\integrate-plugins.bat ${{ env.FALCOR_DIR }}

      - name: Build + verify + deploy
        shell: cmd
        continue-on-error: false
        run: call scripts\ci-windows-build.bat ${{ env.FALCOR_DIR }} %CMAKE_BUILD_PRESET% ${{ matrix.config }} --sccache

      - name: Print sccache stats
        if: always()
        shell: cmd
        run: sccache --show-stats

      - name: Save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-vs2022-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: falcor-windows-vs2022-${{ matrix.config }}
          path: |
            ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/bin/${{ matrix.config }}/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows Ninja/MSVC — secondary build, optional
  # ---------------------------------------------------------------------------
  windows-ninja:
    name: Windows Ninja/MSVC
    needs: [prepare]
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.platform == 'All' || inputs.platform == 'Windows Ninja')
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config: ${{ inputs.config == 'Release' && fromJSON('["Release"]') || inputs.config == 'Debug' && fromJSON('["Debug"]') || fromJSON('["Release", "Debug"]') }}
    env:
      CMAKE_BUILD_PRESET: windows-ninja-msvc-ci
      PM_PACKAGES_ROOT: C:\packman-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.19041.0

      # -- Caching: CMake build directory (incremental builds) -----------------
      # Split into restore/save so we can strip large link artifacts before saving
      - name: Restore CMake build cache
        id: cmake-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-ninja-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-ninja-${{ matrix.config }}-

      # -- Caching: Falcor internal submodules --------------------------------
      - name: Cache Falcor submodules
        uses: actions/cache@v5
        with:
          path: |
            .git/modules/Falcor
            Falcor/external/pybind11
            Falcor/external/glfw
            Falcor/external/args
            Falcor/external/fmt
            Falcor/external/imgui
            Falcor/external/vulkan-headers
          key: falcor-submodules-${{ runner.os }}-v3
          restore-keys: falcor-submodules-

      - name: Init Falcor submodules
        shell: bash
        run: |
          for sub in Falcor/external/pybind11 Falcor/external/glfw Falcor/external/args Falcor/external/fmt Falcor/external/imgui Falcor/external/vulkan-headers; do
            if [ -d "$sub" ] && [ ! -f "$sub/.git" ]; then
              rm -rf "$sub"
            fi
          done
          git submodule update --init --depth 1

      # -- Caching: NVIDIA packman packages -----------------------------------
      - name: Cache packman packages
        uses: actions/cache@v5
        with:
          path: C:\packman-cache
          key: packman-${{ runner.os }}-${{ hashFiles('Falcor/dependencies.xml') }}
          restore-keys: packman-

      - name: Fetch Falcor packman dependencies
        shell: cmd
        run: |
          cd ${{ env.FALCOR_DIR }}
          call tools\packman\packman.cmd pull --platform windows-x86_64 dependencies.xml

      - name: Integrate VisCache plugins into Falcor tree
        shell: cmd
        run: call scripts\integrate-plugins.bat ${{ env.FALCOR_DIR }}

      - name: Build + verify + deploy
        shell: cmd
        continue-on-error: false
        run: call scripts\ci-windows-build.bat ${{ env.FALCOR_DIR }} %CMAKE_BUILD_PRESET% ${{ matrix.config }}

      - name: Save CMake build cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}
          key: cmake-build-${{ runner.os }}-ninja-${{ matrix.config }}-${{ hashFiles('Falcor/Source/**/*.cpp', 'Falcor/Source/**/*.h', 'Source/**/*.cpp', 'Source/**/*.h') }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: falcor-windows-ninja-${{ matrix.config }}
          path: |
            ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/bin/${{ matrix.config }}/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux/GCC — optional, does not block PRs or releases (non-PR only)
  # ---------------------------------------------------------------------------
  linux-gcc:
    name: Linux/GCC
    needs: [prepare]
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.platform == 'All' || inputs.platform == 'Linux GCC' || inputs.platform == '')
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config: ${{ inputs.config == 'Release' && fromJSON('["Release"]') || inputs.config == 'Debug' && fromJSON('["Debug"]') || fromJSON('["Release", "Debug"]') }}
    env:
      CMAKE_BUILD_PRESET: linux-gcc-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: shellcheck
        run: |
          sudo apt-get -qq install -y shellcheck
          shellcheck scripts/integrate-plugins.sh scripts/verify-build-output.sh

      - name: Cache Falcor submodules
        uses: actions/cache@v5
        with:
          path: |
            .git/modules/Falcor
            Falcor/external/pybind11
            Falcor/external/glfw
            Falcor/external/args
            Falcor/external/fmt
            Falcor/external/imgui
            Falcor/external/vulkan-headers
          key: falcor-submodules-${{ runner.os }}-v3
          restore-keys: falcor-submodules-

      - name: Init Falcor submodules
        run: |
          for sub in Falcor/external/pybind11 Falcor/external/glfw Falcor/external/args Falcor/external/fmt Falcor/external/imgui Falcor/external/vulkan-headers; do
            if [ -d "$sub" ] && [ ! -f "$sub/.git" ]; then
              rm -rf "$sub"
            fi
          done
          git submodule update --init --depth 1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libgtk-3-dev

      - name: Fetch Falcor packman dependencies
        run: |
          cd ${{ env.FALCOR_DIR }}
          chmod +x tools/packman/packman
          ./tools/packman/packman pull --platform linux-x86_64 dependencies.xml

      - name: Patch NVTT package
        run: |
          cd ${{ env.FALCOR_DIR }}
          cp -fp external/packman/nvtt/libnvtt.so.30106 external/packman/nvtt/libnvtt.so

      - name: Integrate VisCache plugins into Falcor tree
        run: bash scripts/integrate-plugins.sh ${{ env.FALCOR_DIR }}

      - name: CMake Configure
        run: |
          cd ${{ env.FALCOR_DIR }}
          SRCDIR="$(pwd)"
          ./tools/.packman/cmake/bin/cmake --preset ${{ env.CMAKE_BUILD_PRESET }} \
            -DFALCOR_VALIDATE_HEADERS=OFF \
            "-DCMAKE_C_FLAGS=-ffile-prefix-map=${SRCDIR}/=" \
            "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=${SRCDIR}/="

      - name: Check NRD availability
        run: |
          if [ -d "${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/Source/RenderPasses/NRDPass" ]; then
            echo "[build] NRDPass: ENABLED (FALCOR_HAS_NRD + D3D12)"
          else
            echo ""
            echo "========================================================"
            echo " WARNING: NRDPass DISABLED - missing NRD package or D3D12"
            echo " (Expected on Linux — NRD requires D3D12)"
            echo "========================================================"
            echo ""
            echo "::warning::NRDPass DISABLED on Linux (expected — NRD requires D3D12)"
          fi

      - name: Build
        run: |
          cd ${{ env.FALCOR_DIR }}
          ./tools/.packman/cmake/bin/cmake --build build/${{ env.CMAKE_BUILD_PRESET }} --config ${{ matrix.config }} -j $(nproc)

      # Linux build validates compilation only — no data/DLL verification
      # (NRD requires D3D12, data deployment is Windows-specific)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: falcor-linux-gcc-${{ matrix.config }}
          path: |
            ${{ env.FALCOR_DIR }}/build/${{ env.CMAKE_BUILD_PRESET }}/bin/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Dev prerelease — every successful build creates a release
  # ---------------------------------------------------------------------------
  dev-release:
    name: Dev Prerelease
    runs-on: ubuntu-latest
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.windows-vs2022.result == 'success'
    needs: [prepare, windows-vs2022]
    env:
      # Release if available, otherwise Debug
      RELEASE_CONFIG: ${{ inputs.config == 'Debug' && 'Debug' || 'Release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download VS2022 build artifact
        uses: actions/download-artifact@v7
        with:
          name: falcor-windows-vs2022-${{ env.RELEASE_CONFIG }}
          path: release-bin/

      - name: Package release archive
        run: |
          ARCHIVE="viscache-windows-${{ env.RELEASE_CONFIG }}.tar.gz"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          tar -czf "${ARCHIVE}" -C release-bin .
          ls -lh "${ARCHIVE}"

      - name: Create versioned prerelease
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          SHA="${{ needs.prepare.outputs.sha }}"
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          gh release create "${TAG}" "${{ env.ARCHIVE }}" \
            --title "Dev Build ${VERSION}" \
            --notes "Automated prerelease from \`${SHA_SHORT}\` on \`${GITHUB_REF_NAME}\`.

          | Field | Value |
          |-------|-------|
          | Commit | \`${SHA}\` |
          | Version | \`${VERSION}\` |
          | Config | ${{ env.RELEASE_CONFIG }} |

          **Not a stable release.** Use tagged \`v*\` releases for production." \
            --prerelease \
            --target "${SHA}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old dev prereleases (keep latest 3)
        run: |
          gh release list --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("dev-2")))] | sort_by(.tagName) | reverse | .[3:][] | .tagName' \
          | while read -r tag; do
              echo "Deleting old prerelease: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Tagged release — triggered on v* tags after successful builds
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, windows-vs2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts/

      - name: Package release archives
        run: |
          cd release-artifacts
          for dir in */; do
            name="${dir%/}"
            echo "Packaging ${name}..."
            tar -czf "../${name}.tar.gz" -C "$dir" .
          done
          ls -lh ../*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

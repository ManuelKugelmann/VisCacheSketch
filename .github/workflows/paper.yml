name: Paper Sketch

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'viscachepaper/**'
      - '.github/workflows/paper.yml'
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: paper-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      paper: ${{ steps.filter.outputs.paper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            paper:
              - 'viscachepaper/**'
              - '.github/workflows/paper.yml'

  paper:
    name: Build Combined Markdown
    needs: [changes]
    if: always() && (needs.changes.outputs.paper == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Combine sections into single markdown
        run: |
          python3 viscachepaper/combine_paper.py viscachepaper/paper-combined.md
          LINES=$(wc -l < viscachepaper/paper-combined.md)
          echo "PAPER_LINES=${LINES}" >> $GITHUB_ENV
          echo "Combined paper: ${LINES} lines"

      - name: Prepare Pages artifact
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p _site/latest
          cp viscachepaper/paper-combined.md _site/latest/paper.md
          cp viscachepaper/index.html _site/index.html

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            cp viscachepaper/paper-combined.md _site/paper.md
          else
            curl -fsSL "${PAGES_URL}/paper.md" -o _site/paper.md \
              || cp viscachepaper/paper-combined.md _site/paper.md
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Job summary
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          REPO="${{ github.repository }}"
          echo "## Paper Sketch" >> $GITHUB_STEP_SUMMARY
          echo "Combined markdown built (${PAPER_LINES} lines)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Latest (branch)](${PAGES_URL}/latest/paper.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Stable (main)](${PAGES_URL}/paper.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Section index](https://github.com/${REPO}/blob/${SHORT_SHA}/viscachepaper/paper-sketch.md)" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lines = process.env.PAPER_LINES;
            const sha = context.sha.substring(0, 7);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pagesUrl = `https://${owner}.github.io/${repo}`;
            const sketchUrl = `https://github.com/${owner}/${repo}/blob/${context.sha}/viscachepaper/paper-sketch.md`;
            const body = `**Paper sketch built** (${lines} lines) — [combined markdown](${pagesUrl}/latest/paper.md) | [section index](${sketchUrl}) | \`${sha}\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('**Paper sketch built**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    name: Deploy to GitHub Pages
    needs: paper
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


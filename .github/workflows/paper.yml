name: Paper Sketch

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'viscachepaper/**'
      - 'tests/test_paper_ablations.py'
      - '.github/workflows/paper.yml'
  pull_request:
    branches: ["main", "master"]
    paths:
      - 'viscachepaper/**'
      - 'tests/test_paper_ablations.py'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

concurrency:
  group: paper-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  # ── Fast: combine, wrap, deploy, notify — all one runner ──────────
  paper:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Combine & wrap
        run: |
          python3 viscachepaper/combine_paper.py viscachepaper/paper-combined.md
          LINES=$(wc -l < viscachepaper/paper-combined.md)
          echo "PAPER_LINES=${LINES}" >> $GITHUB_ENV

          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p _site/preview
          python3 viscachepaper/wrap_html.py viscachepaper/paper-combined.md _site/preview/paper.html
          cp viscachepaper/index.html _site/index.html

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            cp _site/preview/paper.html _site/paper.html
          else
            curl -fsSL "${PAGES_URL}/paper.html" -o _site/paper.html \
              || cp _site/preview/paper.html _site/paper.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          REPO="${{ github.repository }}"
          echo "## Paper Sketch" >> $GITHUB_STEP_SUMMARY
          echo "Combined markdown built (${PAPER_LINES} lines)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Latest (branch)](${PAGES_URL}/preview/paper.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [Stable (main)](${PAGES_URL}/paper.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [Section index](https://github.com/${REPO}/blob/${SHORT_SHA}/viscachepaper/paper-sketch.md)" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lines = process.env.PAPER_LINES;
            const sha = context.sha.substring(0, 7);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pagesUrl = `https://${owner}.github.io/${repo}`;
            const sketchUrl = `https://github.com/${owner}/${repo}/blob/${context.sha}/viscachepaper/paper-sketch.md`;
            const body = `**Paper sketch built** (${lines} lines) — [preview](${pagesUrl}/preview/paper.html) | [stable (main)](${pagesUrl}/paper.html) | [section index](${sketchUrl}) | \`${sha}\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('**Paper sketch built**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Parallel: ablation tests ──────────────────────────────────────
  test:
    name: Ablation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_paper_ablations.py

